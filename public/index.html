<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TrackWise – Smart expense tracker to monitor your spending with real-time analytics." />
  <title>TrackWise – Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="logo">💰</div>
      <h1>TrackWise</h1>
      <p class="subtitle">Relational Expense Analytics</p>
    </div>

    <div class="form-card">
      <h2>Add Expense</h2>
      <div class="form-grid">
        <input type="number" id="amount" placeholder="Amount (₹)" min="0" step="0.01" />
        <input type="text" id="category" placeholder="Category (e.g. Food)" />
        <input type="text" id="description" placeholder="Description" class="full-width" />
        <input type="date" id="date" class="full-width" />
      </div>
      <button id="addBtn" onclick="addExpense()">
        <span>➕</span> Add Expense
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Expenses</div>
        <div class="stat-value" id="totalAmount">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Transactions</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Category</div>
        <div class="stat-value" id="topCategory">—</div>
      </div>
    </div>

    <div class="list-section">
      <h2>Expense History</h2>
      <ul id="list">
        <li class="empty-state">No expenses yet. Add one above! 🎉</li>
      </ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
